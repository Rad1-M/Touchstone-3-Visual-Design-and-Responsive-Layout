<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>North Star Bakery - Contact & Pre-order</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>North Star Bakery</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active">Contact & Pre-order</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="card">
        <h2>Pre-order & Inquiry Form</h2>
        <p>Place a custom order request or get in touch with our team.</p>

        <form id="preorder-form" novalidate>
          <fieldset>
            <legend>Contact Information</legend>

            <div class="form-group">
              <label for="name">Full Name *</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
              />
              <span class="error-msg" id="name-error"></span>
            </div>

            <div class="form-group">
              <label for="email">Email Address *</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="example@domain.com"
              />
              <span class="error-msg" id="email-error"></span>
            </div>

            <div class="form-group">
              <label for="notes">Special Order Notes</label>
              <textarea
                id="notes"
                name="notes"
                rows="4"
                placeholder="Specify items or pickup date..."
              ></textarea>
            </div>

            <button type="submit" class="submit-btn">
              Submit Pre-order Request
            </button>
            <p class="success-msg" id="form-success"></p>
          </fieldset>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 North Star Bakery. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
