<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North Star Bakery - Contact & Pre-order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>North Star Bakery</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact & Pre-order</a></li>
            </ul>
        </nav>
    </header>

    <main style="flex-direction: column; width: 100%;">
        <section style="max-width: 600px; margin: 0 auto; width: 100%;">
            <h2>Inquiry and Pre-order Form</h2>
            <form action="#" method="POST">
                <fieldset>
                    <legend>Personal Information</legend>
                    
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </fieldset>

                <fieldset>
                    <legend>Order Details</legend>

                    <label for="request-type">Request Type:</label>
                    <select id="request-type" name="request_type">
                        <option value="pre-order">Pre-order</option>
                        <option value="general-question">General Question</option>
                    </select>

                    <label for="pickup-date">Pickup Date:</label>
                    <input type="date" id="pickup-date" name="pickup_date">

                    <label for="item-details">Item Details & Quantities:</label>
                    <textarea id="item-details" name="item_details" rows="4" placeholder="Specify items like sourdough loaves, pastries, etc."></textarea>

                    <label for="allergy-notes">Allergy Notes (if applicable):</label>
                    <textarea id="allergy-notes" name="allergy_notes" rows="2" placeholder="Mention any dietary restrictions or allergies"></textarea>
                </fieldset>

                <button type="submit">Submit Request</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 North Star Bakery. All rights reserved.</p>
    </footer>

</body>
</html>
